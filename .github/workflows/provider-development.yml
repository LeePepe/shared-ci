.run(list(map(str, argv)), cwd=cwd or ROOT,\\n                            env=env or CLEAN, stdin=subprocess.DEVNULL,\\n                            stdout=subprocess.PIPE, stderr=subprocess.PIPE,\\n                            close_fds=True, timeout=timeout)\\n    require(result.returncode == 0, \\\"command failed: \\\" + repr(argv) + \\\" stderr=\\\" +\\n            result.stderr.decode(\\\"utf-8\\\", \\\"backslashreplace\\\"))\\n    return result.stdout.decode(\\\"utf-8\\\", \\\"strict\\\").strip()\\ndef git(*argv):\\n    return command([\\\"/usr/bin/git\\\", *argv], cwd=SOURCE, env=GITENV)\\ndef verify_source(label):\\n    require(SOURCE.resolve() == SOURCE and (SOURCE / \\\".git\\\").is_dir()\\n            and not (SOURCE / \\\".git\\\").is_symlink(), \\\"standalone source required\\\")\\n    actual = dict(head=git(\\\"rev-parse\\\", \\\"HEAD\\\"), tree=git(\\\"rev-parse\\\", \\\"HEAD^{tree}\\\"),\\n                  format=git(\\\"rev-parse\\\", \\\"--show-object-format=storage\\\"),\\n                  shallow=git(\\\"rev-parse\\\", \\\"--is-shallow-repository\\\"))\\n    emit(\\\"source\\\", phase=label, **actual)\\n    require(actual == dict(head=MANIFEST[\\\"commit\\\"], tree=MANIFEST[\\\"tree\\\"],\\n                           format=\\\"sha1\\\", shallow=\\\"false\\\"), \\\"source identity mismatch\\\")\\n    require(not (SOURCE / \\\".git/HEAD\\\").read_text().startswith(\\\"ref:\\\"), \\\"detached S required\\\")\\n    for rel in (\\\"shallow\\\", \\\"objects/info/alternates\\\", \\\"objects/info/http-alternates\\\",\\n                \\\"info/grafts\\\"):\\n        require(not os.path.lexists(SOURCE / \\\".git\\\" / rel), \\\"non-self-contained Git: \\\" + rel)\\n    require(not list((SOURCE / \\\".git\\\").rglob(\\\"*.promisor\\\")), \\\"promisor objects\\\")\\n    config = git(\\\"config\\\", \\\"--local\\\", \\\"--list\\\")\\n    require(\\\"promisor\\\" not in config.lower() and \\\"partialclone\\\" not in config.lower(),\\n            \\\"partial 