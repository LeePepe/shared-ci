          "run": "set -eu\n/usr/bin/python3 -I -S -B - \"$TASK_ROOT\" <<'PY'\nimport pathlib, sys\nroot = pathlib.Path(sys.argv[1])\n__file__ = str(root / \"common.py\")\nexec(compile((root / \"common.py\").read_bytes(), __file__, \"exec\"))\nimport re\nrequire(re.fullmatch(r\"/tmp/shared-ci-provider-suite\\.[A-Za-z0-9]{8}\", str(ROOT)) is not None,\n        \"unexpected canonical task root\")\nrequire(ROOT.resolve() == ROOT and ROOT.stat().st_uid == os.getuid(), \"task ownership\")\ndata = json.loads(STATE.read_text())\n# Capture again AFTER all acquisitions. No handle to the host namespace is opened.\nuid, gid, host_net = os.getuid(), os.getgid(), os.readlink(\"/proc/self/ns/net\")\nrequire(uid > 0 and gid > 0 and (uid,gid,host_net) ==\n        (data[\"uid\"],data[\"gid\"],data[\"host_net\"]), \"original identity changed\")\nrequire(all(str(n).isdigit() for n in (uid,gid)), \"numeric launcher IDs\")\nfor key, literal in {\"sudo\":\"/usr/bin/sudo\", \"unshare\":\"/usr/bin/unshare\",\n                     \"setpriv\":\"/usr/bin/setpriv\", \"env\":\"/usr/bin/env\",\n                     \"shell\":\"/bin/sh\", \"python\":\"/usr/bin/python3\"}.items():\n    admitted = data[\"tools\"][key]\n    require(str(P(literal).resolve()) == admitted[\"path\"]\n            and digest(literal) == admitted[\"sha256\"], \"launcher tool mismatch\")\nfor name in (\"common.py\",\"offline.py\",\"source-manifest.json\",\"wheel-pins.json\"):\n    path = ROOT/name\n    require(path.resolve() == path and path.is_file() and path.stat().st_uid == uid,\n            \"driver/input ownership\")\n    emit(\"driver-input\", name=name, bytes=path.stat().st_size, sha256=digest(path))\ndriver = ROOT/\"offline-driver.sh\"\nwith driver.open(\"x\") as stream:\n    stream.write(\"#!/bin/sh\\nset -eu\\nexec /usr/bin/python3 -I -S -B \" +\n                 str(ROOT/\"offline.py\") + \"\\n\")\nrequire(driver.resolve() == driver and driver.stat().st_uid == uid, \"driver canonical identity\")\nargv = [\"/usr/bin/sudo\",\"-n\",\"--\",\"/usr/bin/unshare\",\"--net\",\"--\",\n        \"/usr/bin/setpriv\",\"--reuid=\"+str(uid),\"--regid=\"+str(gid),\n        \"--clear-groups\",\"--bounding-set=-all\",\"--inh-caps=-all\",\"--ambient-caps=-all\",\n        \"--no-new-privs\",\"--\",\"/usr/bin/env\",\"-i\",\"PATH=/usr/bin:/bin\",\"LC_ALL=C\",\n        \"/bin/sh\",str(driver)]\nemit(\"launcher\", argv=argv, driver_sha256=digest(driver),\n     uid=uid, gid=gid, original_groups=os.getgroups(), host_net=host_net,\n     root_scope=\"standard sudo/unshare/setpriv/env only; shell starts after drop\")\n# Close extras through Popen; no pass_fds, namespace handles or sockets.\n# stdin is /dev/null, stdout/stderr are ordinary job-log descriptors.\nstarted = time.monotonic()\nsave(ROOT/\"launch.json\", dict(started_monotonic=started,\n     deadline_monotonic=started+12, ceiling=15, recovery_seconds=3))\nchild = subprocess.Popen(argv, cwd=ROOT, env=CLEAN, stdin=subprocess.DEVNULL,\n                         close_fds=True, start_new_session=True)\nfailure = None\ndef stop(deadline):\n    try:\n        os.killpg(child.pid, signal.SIGTERM)\n    except ProcessLookupError:\n        pass\n    try:\n        child.wait(timeout=max(0.01, deadline-time.monotonic()-1))\n    except subprocess.TimeoutExpired:\n        try:\n            os.killpg(child.pid, signal.SIGKILL)\n        except ProcessLookupError:\n            pass\n        try:\n            child.wait(timeout=max(0.01, deadline-time.monotonic()))\n        except subprocess.TimeoutExpired:\n            pass\ntry:\n    # One finite startup acknowledgement; not a test observer or re-entry path.\n    while not (ROOT/\"namespace-ready\").exists():\n        require(child.poll() is None, \"namespace/driver exited before admission\")\n        if time.monotonic() >= started+12:\n            stop(started+15)\n            raise RuntimeError(\"namespace admission exceeded 12+3 seconds\")\n        time.sleep(0.05)\n    require((ROOT/\"namespace-ready\").read_text() == \"admitted\\n\", \"namespace readiness\")\n    emit(\"namespace-stage\", ceiling=15, seconds=round(time.monotonic()-started,6),\n         exit=0, record=json.loads((ROOT/\"namespace.json\").read_text()))\n    # 780s is the exact remaining listed ceiling sum (15+765).\n    # This 800s outer safety bound only adds orchestration/termination margin;\n    # each inner stage retains its own smaller, unextended deadline.\n    try:\n        child.wait(timeout=max(0.01, started+785-time.monotonic()))\n    except subprocess.TimeoutExpired:\n        stop(started+800)\n        raise RuntimeError(\"offline lineage outer watchdog expired; no retry\")\n    require(child.returncode == 0, \"offline lineage failed\")\nexcept BaseException as error:\n    failure = repr(error)\n    if child.poll() is None:\n        stop(min(started+800, time.monotonic()+3))\n    if not os.path.lexists(ROOT/\"first-failure.json\"):\n        save(ROOT/\"first-failure.json\", dict(error=failure))\nfinally:\n    # Host-network scope resumes only for reading owned evidence. No imports,\n    # installation, candidate checks or tests run here or in any later step.\n    evidence_ok = True\n    for name in EVIDENCE_STAGES:\n        try:\n            row, raw, normal = stage_evidence(name)\n            if not normal:\n                evidence_ok = False\n                failure = failure or (\"unsuccessful stage evidence: \" + name)\n            emit(\"raw-log\", name=name + \".log\", bytes=len(raw),\n                 sha256=hashlib.sha256(raw).hexdigest())\n            for offset in range(0, len(raw), 2048):\n                emit(\"raw-log-chunk\", name=name + \".log\", offset=offset,\n                     text=raw[offset:offset+2048].decode(\"utf-8\", \"backslashreplace\"))\n            if name == \"final\":\n                emit(\"final-stage\", **row)\n        except Exception as error:\n            evidence_ok = False\n            failure = failure or repr(error)\n            emit(\"invalid-stage-evidence\", name=name, error=repr(error), retained=True)\n    if os.path.lexists(ROOT/\"first-failure.json\"):\n        evidence_ok = False\n        failure = failure or \"existing first-failure evidence retained\"\n    if not evidence_ok:\n        if not os.path.lexists(ROOT/\"first-failure.json\"):\n            save(ROOT/\"first-failure.json\", dict(error=failure))\n        emit(\"incomplete-evidence\", root=str(ROOT), retained=True)\n    emit(\"terminal\", status=\"GREEN\" if failure is None and evidence_ok else \"FAILED\",\n         scope=\"bounded provider development only; not D1/R0/6DQ/real-caller certification\",\n         error=failure, exit=child.returncode, evidence_root=str(ROOT),\n         retained_until_runner_teardown=True, retries=0, automatic_cleanup=False)\nrequire(failure is None and evidence_ok, \"failed closed; evidence retained\")\nPY\n"
        }
