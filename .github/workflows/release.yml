name: release

# Reusable cross-target version parity, release execution, and post-release
# live-readback verification workflow. Pin by full 40-char SHA.

on:
  workflow_call:
    inputs:
      shared-ci-repository:
        description: Provider repository for shared-ci scripts.
        type: string
        default: LeePepe/shared-ci
      shared-ci-sha:
        description: Optional 40-char commit SHA for shared-ci (defaults to .github/repo-contract.json shared_ci or AGENTS.md pin).
        type: string
        default: ""
      expected-version:
        description: Expected SemVer version (optional; defaults to canonical manifest version).
        type: string
        default: ""
      targets:
        description: Optional comma-separated manifest paths for version-sync.
        type: string
        default: ""
      check-stale:
        description: Optional comma-separated file paths scanned for leftover version strings.
        type: string
        default: ""
      setup-command:
        description: Optional setup command executed before release-command.
        type: string
        default: ""
      release-command:
        description: Optional caller build, package, or publish command.
        type: string
        default: ""
      artifacts-glob:
        description: Optional glob pattern(s) for release artifacts to hash and verify against SHA256SUMS.
        type: string
        default: ""
      checksums-file:
        description: Path to the SHA-256 checksums manifest when artifacts-glob is used.
        type: string
        default: SHA256SUMS
      live-url:
        description: Optional HTTP/HTTPS /api/live endpoint URL for post-deploy readback verification.
        type: string
        default: ""
      release-json:
        description: Optional path to GitHub Release JSON metadata for release asset readback.
        type: string
        default: ""
      readback-timeout:
        description: HTTP timeout in seconds for live-url readback.
        type: number
        default: 10
      readback-retries:
        description: HTTP retry count for live-url readback.
        type: number
        default: 3
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 30
    outputs:
      version:
        description: Verified SemVer version from version-sync.
        value: ${{ jobs.release.outputs.version }}
      released-sha:
        description: Commit SHA verified by the release workflow.
        value: ${{ jobs.release.outputs.released-sha }}

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      version: ${{ steps.version-sync.outputs.version }}
      released-sha: ${{ steps.sha.outputs.released-sha }}
    steps:
      - name: Check out caller at the target SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: sha
        run: echo "released-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve shared-ci provider revision
        id: provider
        env:
          INPUT_REPOSITORY: ${{ inputs.shared-ci-repository }}
          INPUT_SHA: ${{ inputs.shared-ci-sha }}
        run: |
          python3 -I -B -c '
          import json
          import os
          import pathlib
          import re
          import subprocess

          repo = os.environ.get("INPUT_REPOSITORY", "").strip() or "LeePepe/shared-ci"
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("::error::invalid shared-ci-repository: " + repo)

          input_sha = os.environ.get("INPUT_SHA", "").strip()
          if input_sha and not re.fullmatch(r"[0-9a-f]{40}", input_sha):
              raise SystemExit("::error::shared-ci-sha must be a full lowercase 40-char SHA")

          contract_pin = ""
          metadata = pathlib.Path(".github/repo-contract.json")
          if metadata.is_symlink() or metadata.parent.is_symlink():
              raise SystemExit("::error::repository metadata must not traverse a symlink")
          if metadata.exists():
              if not metadata.is_file():
                  raise SystemExit("::error::repository metadata must be a regular file")
              rows = subprocess.check_output(
                  ["git", "ls-files", "--stage", "--", str(metadata)], text=True
              ).splitlines()
              if len(rows) != 1 or not re.fullmatch(
                  r"100(?:644|755) [0-9a-f]+ 0\t\.github/repo-contract\.json", rows[0]
              ):
                  raise SystemExit("::error::repository metadata must be tracked and unconflicted")
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate metadata key: " + key)
                      result[key] = value
                  return result
              data = json.loads(metadata.read_text(encoding="utf-8"), object_pairs_hook=unique)
              if not isinstance(data, dict) or not isinstance(data.get("shared_ci"), str):
                  raise SystemExit("::error::invalid shared_ci field in .github/repo-contract.json")
              contract_pin = data["shared_ci"]
              if not re.fullmatch(r"[0-9a-f]{40}", contract_pin):
                  raise SystemExit("::error::.github/repo-contract.json shared_ci must be a 40-char SHA")
          else:
              agents = pathlib.Path("AGENTS.md")
              if agents.is_symlink():
                  raise SystemExit("::error::AGENTS.md must not be a symlink")
              if agents.is_file():
                  text = agents.read_text(encoding="utf-8")
                  pins = set(
                      re.findall(
                          r"(?:LeePepe/shared-ci@|github\.com/LeePepe/shared-ci/blob/)([0-9a-f]{40})/ai/agent-protocol\.md",
                          text,
                      )
                  )
                  if len(pins) > 1:
                      raise SystemExit("::error::multiple shared-ci pins found in AGENTS.md")
                  if len(pins) == 1:
                      contract_pin = pins.pop()

          if input_sha and contract_pin and input_sha != contract_pin:
              raise SystemExit(
                  f"::error::shared-ci-sha ({input_sha}) does not match repository contract pin ({contract_pin})"
              )

          resolved_sha = input_sha or contract_pin
          if not re.fullmatch(r"[0-9a-f]{40}", resolved_sha):
              raise SystemExit(
                  "::error::shared-ci revision unavailable; set shared-ci-sha or .github/repo-contract.json shared_ci"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out_file:
              out_file.write(f"repository={repo}\nsha={resolved_sha}\n")
          '
      - name: Check out shared-ci at the pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.provider.outputs.repository }}
          ref: ${{ steps.provider.outputs.sha }}
          path: .shared-ci
          persist-credentials: false
      - name: Confirm shared-ci revision
        env:
          WORKFLOW_REPOSITORY: ${{ steps.provider.outputs.repository }}
          WORKFLOW_SHA: ${{ steps.provider.outputs.sha }}
        run: |
          case "$WORKFLOW_SHA" in *[!0-9a-f]*|"") echo "::error::shared-ci SHA unavailable"; exit 1 ;; esac
          [ "${#WORKFLOW_SHA}" -eq 40 ] && [ -n "$WORKFLOW_REPOSITORY" ] || { echo "::error::shared-ci identity unavailable"; exit 1; }
          [ "$(git -C .shared-ci rev-parse HEAD)" = "$WORKFLOW_SHA" ] || { echo "::error::.shared-ci is not $WORKFLOW_SHA"; exit 1; }
      - name: Verify cross-target version parity
        id: version-sync
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          TARGETS: ${{ inputs.targets }}
          CHECK_STALE: ${{ inputs.check-stale }}
        run: |
          args=(version-sync --root . --check)
          if [ -n "$EXPECTED_VERSION" ]; then
            args+=(--version "$EXPECTED_VERSION")
          fi
          if [ -n "$TARGETS" ]; then
            args+=(--targets "$TARGETS")
          fi
          if [ -n "$CHECK_STALE" ]; then
            args+=(--check-stale "$CHECK_STALE")
          fi
          report="$(python3 -I -B .shared-ci/scripts/quality/release_sync.py "${args[@]}")"
          printf '%s\n' "$report"
          resolved_version="$(python3 -I -B -c 'import json,sys; print(json.loads(sys.stdin.read())["version"])' <<< "$report")"
          echo "version=$resolved_version" >> "$GITHUB_OUTPUT"
      - if: inputs.setup-command != ''
        name: Run setup command
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - if: inputs.release-command != ''
        name: Run release command
        env:
          COMMAND: ${{ inputs.release-command }}
          RELEASE_VERSION: ${{ steps.version-sync.outputs.version }}
          RELEASE_SHA: ${{ steps.sha.outputs.released-sha }}
        run: bash -euo pipefail -c "$COMMAND"
      - if: inputs.artifacts-glob != '' || inputs.live-url != '' || inputs.release-json != ''
        name: Verify SHA256SUMS and post-deploy live readback
        env:
          VERSION: ${{ steps.version-sync.outputs.version }}
          RELEASED_SHA: ${{ steps.sha.outputs.released-sha }}
          ARTIFACTS_GLOB: ${{ inputs.artifacts-glob }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
          LIVE_URL: ${{ inputs.live-url }}
          RELEASE_JSON: ${{ inputs.release-json }}
          TIMEOUT: ${{ inputs.readback-timeout }}
          RETRIES: ${{ inputs.readback-retries }}
        run: |
          rb_args=(readback --root . --expected-version "$VERSION" --expected-sha "$RELEASED_SHA" --timeout "$TIMEOUT" --retries "$RETRIES")
          if [ -n "$ARTIFACTS_GLOB" ]; then
            shopt -s nullglob
            read -r -a patterns <<< "$ARTIFACTS_GLOB"
            artifacts=()
            for pattern in "${patterns[@]}"; do
              for match in $pattern; do
                artifacts+=("$match")
              done
            done
            if [ "${#artifacts[@]}" -eq 0 ]; then
              echo "::error::artifacts-glob matched no files: $ARTIFACTS_GLOB"
              exit 1
            fi
            if [ ! -f "$CHECKSUMS_FILE" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "${artifacts[@]}" > "$CHECKSUMS_FILE"
              else
                shasum -a 256 "${artifacts[@]}" > "$CHECKSUMS_FILE"
              fi
            fi
            rb_args+=(--checksums-file "$CHECKSUMS_FILE")
            for artifact in "${artifacts[@]}"; do
              rb_args+=(--artifact "$artifact")
            done
          fi
          if [ -n "$LIVE_URL" ]; then
            rb_args+=(--live-url "$LIVE_URL")
          fi
          if [ -n "$RELEASE_JSON" ]; then
            rb_args+=(--release-json "$RELEASE_JSON")
          fi
          python3 -I -B .shared-ci/scripts/quality/release_sync.py "${rb_args[@]}"
