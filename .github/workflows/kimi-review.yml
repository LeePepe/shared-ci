name: kimi-review

# Reusable ADVISORY AI review. Same trust model as codex-review.yml (fork guard,
# trusted base checkout, diff read as data). Findings are posted as a sticky PR
# comment; unavailable reviews are skipped or clearly reported, never a pass.
# Kimi never blocks and must never be a required check.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels for the local-CLI runner.
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      kimi-bin:
        type: string
        default: kimi
      kimi-model:
        type: string
        default: kimi-code/k3
      rules-file:
        type: string
        default: ""
      max-diff-bytes:
        type: number
        default: 80000
      timeout-minutes:
        type: number
        default: 12

permissions:
  contents: read
  pull-requests: write

jobs:
  kimi-execute:
    name: Kimi advisory execution (not the completion check)
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: true
    outputs:
      completed: ${{ steps.review.outputs.completed }}
    steps:
      - name: Probe kimi CLI availability (not a review)
        id: probe
        shell: bash
        env:
          KIMI_BIN: ${{ inputs.kimi-bin }}
        run: |
          KIMI_BIN="${KIMI_BIN:-kimi}"
          if command -v "$KIMI_BIN" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::kimi review unavailable: kimi CLI is not installed on the runner"
            echo "kimi review unavailable: kimi CLI is not installed on the runner" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out trusted base (never the PR head)
        if: steps.probe.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check out shared-ci review scripts at the pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-ci
          persist-credentials: false
      - name: Confirm shared-ci revision
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          case "$WORKFLOW_SHA" in *[!0-9a-f]*|"") echo "::error::job.workflow_sha unavailable"; exit 1 ;; esac
          [ "${#WORKFLOW_SHA}" -eq 40 ] && [ -n "$WORKFLOW_REPOSITORY" ] || { echo "::error::shared-ci identity unavailable"; exit 1; }
          [ "$(git -C .shared-ci rev-parse HEAD)" = "$WORKFLOW_SHA" ] || { echo "::error::.shared-ci is not $WORKFLOW_SHA"; exit 1; }
      - name: Publish unavailable advisory comment
        if: steps.probe.outputs.available == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- shared-ci-kimi-review -->"
          BODY="$(python3 -B .shared-ci/scripts/review/verdict.py --tool kimi --mode advisory \
            --marker "$MARKER" --head "$HEAD_SHA" --unavailable "kimi CLI is not installed on the runner")"
          . .shared-ci/scripts/review/sticky.sh
          post_sticky "$MARKER" "$BODY" || true

      - name: Run advisory kimi review on the PR diff
        id: review
        if: steps.probe.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.repository }}
          SHARED_CI_DIR: ${{ github.workspace }}/.shared-ci
          KIMI_BIN: ${{ inputs.kimi-bin }}
          KIMI_MODEL: ${{ inputs.kimi-model }}
          REVIEW_RULES_FILE: ${{ inputs.rules-file }}
          REVIEW_MAX_BYTES: ${{ inputs.max-diff-bytes }}
        run: bash .shared-ci/scripts/review/kimi-review.sh

  kimi-review:
    needs: [kimi-execute]
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && needs.kimi-execute.outputs.completed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Report completed advisory review
        run: echo "Kimi advisory review completed; findings never block merge."
