name: stuck-PR bot (self-adoption)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  report:
    uses: LeePepe/shared-ci/.github/workflows/stuck-pr-bot.yml@ed6c35fa59be4dd9aaf7ccf5f83fa1eb246f34fc
    with:
      failure-hours: 2
      open-hours: 24
