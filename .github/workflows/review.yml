name: review

# AI review for shared-ci's own PRs (dogfood; pinned to an earlier commit).
# pull_request_target evaluates this file from main, so it takes effect after merge.
# shared-ci has no self-hosted review runner by design. The jobs run only when the
# repository variable SHARED_CI_REVIEW_RUNNER is 'true'; otherwise they are skipped
# (not required) instead of leaving runs queued forever on every PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review-target:
    if: vars.SHARED_CI_REVIEW_RUNNER == 'true'
    uses: LeePepe/shared-ci/.github/workflows/codex-review.yml@9ff304e317a5ff924a4c488515ead5a607d28236

  kimi-review:
    if: vars.SHARED_CI_REVIEW_RUNNER == 'true'
    uses: LeePepe/shared-ci/.github/workflows/kimi-review.yml@9ff304e317a5ff924a4c488515ead5a607d28236
