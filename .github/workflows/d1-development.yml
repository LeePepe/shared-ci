{
  "name": "Hosted D1 development",
  "on": {
    "push": {
      "branches": [
        "upgrade/shared-ci-hosted-d1-dev-20260923"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "shared-ci-hosted-d1-upgrade-shared-ci-hosted-d1-dev-20260923",
    "cancel-in-progress": false
  },
  "jobs": {
    "d1-development": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {},
      "steps": [
        {
          "name": "Observe exact S — development evidence only",
          "shell": "/bin/bash --noprofile --norc -p -e -u -o pipefail {0}",
          "env": {
            "D1_PAYLOAD_OBSERVER_00": "",
            "D1_PAYLOAD_OBSERVER_01": "",
            "D1_PAYLOAD_OBSERVER_02": "",
            "D1_PAYLOAD_OBSERVER_03": "",
            "D1_PAYLOAD_OBSERVER_04": "",
            "D1_PAYLOAD_OBSERVER_05": "",
            "D1_PAYLOAD_OBSERVER_06": "",
            "D1_PAYLOAD_OBSERVER_07": "",
            "D1_PAYLOAD_OBSERVER_08": "",
            "D1_PAYLOAD_CONFIG_00": ""
          },
          "run": "set +x\nset +v\nfor d1_name in \"${!LD_@}\" \"${!DYLD_@}\" \"${!PYTHON@}\" \"${!GIT_@}\" \"${!SSH_@}\" \"${!GCM_@}\" \"${!PERL@}\" \"${!RUBY@}\" \"${!NODE@}\" \"${!BASH_FUNC_@}\"; do\n  if [[ -n \"$d1_name\" ]]; then\n    unset -v \"$d1_name\"\n  fi\ndone\nunset -v PATH BASH_ENV ENV CDPATH TMPDIR TMP TEMP GCONV_PATH LOCPATH NLSPATH GLIBC_TUNABLES XDG_CONFIG_HOME XDG_CACHE_HOME SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE REQUESTS_CA_BUNDLE http_proxy https_proxy all_proxy no_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY\nunset -v d1_name\nexec /usr/bin/python3 -I -S -B - <<'D1_BOOTSTRAP_PY'\nimport time\nsetup_started = time.monotonic()\nimport base64\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport stat\nimport sys\nimport tempfile\n\nCONFIG_SHA256 = \"4b5cac8cdef659815d70a986035b9d2a6d671abe5825322a0771cc0ec1e1a31e\"\nOBSERVER_SHA256 = \"2b8f0355357433fefa4d874b53bc5fe12fec25f4f02388b085eeeacc79cabc1d\"\nFORBIDDEN_PREFIXES = (\"LD_\", \"DYLD_\", \"PYTHON\", \"GIT_\", \"SSH_\", \"GCM_\", \"PERL\", \"RUBY\", \"NODE\", \"BASH_FUNC_\")\nFORBIDDEN_KEYS = [\"ALL_PROXY\",\"BASH_ENV\",\"CDPATH\",\"CURL_CA_BUNDLE\",\"ENV\",\"GCONV_PATH\",\"GLIBC_TUNABLES\",\"HTTPS_PROXY\",\"HTTP_PROXY\",\"LOCPATH\",\"NLSPATH\",\"NO_PROXY\",\"PATH\",\"REQUESTS_CA_BUNDLE\",\"SSL_CERT_DIR\",\"SSL_CERT_FILE\",\"TEMP\",\"TMP\",\"TMPDIR\",\"XDG_CACHE_HOME\",\"XDG_CONFIG_HOME\",\"all_proxy\",\"http_proxy\",\"https_proxy\",\"no_proxy\"]\nLAYOUT = {\"OBSERVER\": (9, 102822, OBSERVER_SHA256), \"CONFIG\": (1, 7916, CONFIG_SHA256)}\n\ndef need(condition):\n    if not condition:\n        raise ValueError(\"bootstrap\")\n\ndef timely():\n    need(time.monotonic() < setup_started + 45)\n\ndef digest(raw):\n    return hashlib.sha256(raw).hexdigest()\n\ndef pairs(items):\n    result = {}\n    for key, value in items:\n        need(key not in result)\n        result[key] = value\n    return result\n\ndef nonfinite(_value):\n    raise ValueError(\"bootstrap\")\n\ndef stamp(info):\n    return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_nlink,\n            info.st_size, info.st_mtime_ns, info.st_ctime_ns)\n\ndef materialize(directory, name, raw, expected):\n    timely()\n    path = directory / name\n    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n    try:\n        info = os.fstat(fd)\n        need(stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o600\n             and info.st_uid == os.getuid() and info.st_nlink == 1)\n        view = memoryview(raw)\n        while view:\n            timely()\n            written = os.write(fd, view)\n            need(written > 0)\n            view = view[written:]\n        identity = stamp(os.fstat(fd))\n    finally:\n        os.close(fd)\n    timely()\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    with os.fdopen(fd, \"rb\") as stream:\n        need(stamp(os.fstat(stream.fileno())) == identity)\n        reread = stream.read(len(raw) + 1)\n        need(stamp(os.fstat(stream.fileno())) == identity)\n    need(stamp(path.lstat()) == identity and path.resolve() == path\n         and reread == raw and digest(reread) == expected)\n    timely()\n    return path, reread\n\ntry:\n    timely()\n    need(sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode)\n    need(not any(key.startswith(FORBIDDEN_PREFIXES) or key in FORBIDDEN_KEYS\n                 for key in os.environ))\n    expected_names = {\n        \"D1_PAYLOAD_\" + kind + \"_\" + format(i, \"02d\")\n        for kind, (count, _, _) in LAYOUT.items() for i in range(count)\n    }\n    need({key for key in os.environ if key.startswith(\"D1_PAYLOAD_\")} == expected_names)\n    payloads = {}\n    for kind, (count, size, expected_digest) in LAYOUT.items():\n        encoded_size = ((size + 2) // 3) * 4\n        need(count == (encoded_size + 16383) // 16384)\n        chunks = []\n        for i in range(count):\n            name = \"D1_PAYLOAD_\" + kind + \"_\" + format(i, \"02d\")\n            chunk = os.environ.pop(name).encode(\"ascii\", errors=\"strict\")\n            need(len(chunk) == min(16384, encoded_size - i * 16384))\n            chunks.append(chunk)\n        encoded = b\"\".join(chunks)\n        raw = base64.b64decode(encoded, validate=True)\n        need(len(raw) == size and base64.b64encode(raw) == encoded\n             and digest(raw) == expected_digest)\n        payloads[kind] = raw\n        timely()\n    need(not any(key.startswith(\"D1_PAYLOAD_\") for key in os.environ))\n    config_raw, observer_raw = payloads[\"CONFIG\"], payloads[\"OBSERVER\"]\n    need(len(config_raw) <= 16384 and observer_raw.endswith(b\"\\n\"))\n    config = json.loads(config_raw.decode(\"utf-8\", errors=\"strict\"),\n                        object_pairs_hook=pairs, parse_constant=nonfinite)\n    need(type(config) is dict and set(config) == {\n        \"schema\", \"protocol_sha256\", \"observer_sha256\", \"source\",\n        \"operation\", \"platform\", \"tool_policy\"})\n    need(json.dumps(config, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=True,\n                    allow_nan=False).encode(\"ascii\") == config_raw)\n    need(type(config[\"schema\"]) is int and config[\"schema\"] == 2\n         and config[\"observer_sha256\"] == OBSERVER_SHA256\n         and config[\"protocol_sha256\"] == \"95a1aa46a8becd45998d6e24be4299683e035f124356b1dd52e9b3231c4d696e\"\n         and config[\"source\"][\"commit\"] == \"b0d2355904378e2eb69efbb042e1f95bc0358c6a\"\n         and config[\"source\"][\"tree\"] == \"444c72e4cfa14246ab311527ababd6a50a0d7b35\"\n         and len(config[\"source\"][\"files\"]) == 39)\n    scratch = Path(\"/tmp\")\n    need(scratch.resolve() == scratch and scratch.is_dir() and not scratch.is_symlink())\n    directory = Path(tempfile.mkdtemp(prefix=\"hosted-d1-bootstrap-\", dir=scratch))\n    info = directory.lstat()\n    need(directory.resolve() == directory and stat.S_ISDIR(info.st_mode)\n         and stat.S_IMODE(info.st_mode) == 0o700 and info.st_uid == os.getuid())\n    expectations_path, _ = materialize(directory, \"static.json\", config_raw, CONFIG_SHA256)\n    observer_path, verified_observer = materialize(directory, \"observer.py\", observer_raw, OBSERVER_SHA256)\n    sys.argv = [str(observer_path), \"--expectations\", str(expectations_path),\n                \"--expectations-sha256\", CONFIG_SHA256, \"--scratch-parent\", \"/tmp\",\n                \"--execute-hosted-development\"]\n    namespace = {\n        \"__name__\": \"__main__\", \"__file__\": str(observer_path),\n        \"_D1_BOOTSTRAP\": {\"v\": 1, \"setup_started\": setup_started, \"pid\": os.getpid(),\n                          \"observer_sha256\": OBSERVER_SHA256,\n                          \"expectations_sha256\": CONFIG_SHA256},\n    }\n    timely()\n    code = compile(verified_observer, str(observer_path), \"exec\")\n    timely()\nexcept BaseException:\n    sys.stderr.write('{\"result\":\"FAIL-CLOSED\",\"reason\":\"bootstrap\"}\\n')\n    raise SystemExit(1) from None\nexec(code, namespace)\nD1_BOOTSTRAP_PY\n"
        }
      ]
    }
  }
}
