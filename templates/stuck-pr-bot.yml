name: stuck-PR bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  report:
    # Replace with the delivered full 40-character provider SHA, matching other pins.
    uses: LeePepe/shared-ci/.github/workflows/stuck-pr-bot.yml@<40-char-sha>
    with:
      failure-hours: 2
      open-hours: 24
