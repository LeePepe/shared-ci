name: stuck-PR bot

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  report:
    # Replace with the delivered full 40-character provider SHA, matching other pins.
    uses: LeePepe/shared-ci/.github/workflows/stuck-pr-bot.yml@<40-char-sha>
    with:
      failure-hours: 2
      open-hours: 24
      stale-days: 14
      draft-days: 7
      auto-merge-grace-minutes: 30
      thread-hours: 24
      mention-allowlist: LeePepe
      summary-assignee: LeePepe
      # Pick a unique pair of minutes for each consumer, such as 7,37.
      exclude-prs: ''
      auto-merge-exempt-prs: ''
