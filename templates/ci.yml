# Caller workflow. Copy to .github/workflows/ci.yml. Replace every
# <40-char-sha> with ONE shared-ci commit SHA (metadata shared_ci must match).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: LeePepe/shared-ci/.github/workflows/quality.yml@<40-char-sha>
    with:
      runs-on: macos-15
      setup-command: ""
      # changed-only (v0.2.0+): run only the layers the PR diff touches, plus
      # their dependents. A PR that touches no layer short-circuits the command
      # lanes (they still report success). Anything doubtful is a full run.
      # Omit it (or set false) for the v0.1.0 behaviour: every lane runs in full.
      changed-only: true
      # `--selected` runs $CI_SELECTED_LAYERS, or every layer on a full run.
      verify-command: scripts/verify --selected
      lint-command: ""
      build-command: ""
      test-command: ""

  # Optional: your own required lanes (e.g. one check per package). Call
  # select.yml at the SAME SHA and decide at STEP level, never with a job-level
  # `if`, so the check always reports. See docs/changed-layer-selection.md.
